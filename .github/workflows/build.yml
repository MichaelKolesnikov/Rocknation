name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  # Flet installs Flutter itself; keep its output readable in the log.
  FLET_CLI_NO_RICH_OUTPUT: "1"
  PYTHONUTF8: "1"

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pip install -e ./flet_bg_audio -e . "flet[all]==1.0.5"

      - name: Prepare build template
        run: python tools/prepare_template.py

      # Without the ANDROID_KEYSTORE secret the APK is signed with the debug key.
      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: echo "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          args=(--yes --arch arm64-v8a --build-number "$GITHUB_RUN_NUMBER")
          if [ "$HAS_KEYSTORE" = true ]; then
            args+=(--android-signing-key-store "$RUNNER_TEMP/release.jks"
                   --android-signing-key-store-password "$ANDROID_KEYSTORE_PASSWORD"
                   --android-signing-key-password "$ANDROID_KEY_PASSWORD"
                   --android-signing-key-alias "$ANDROID_KEY_ALIAS")
          fi
          flet build apk "${args[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: rocknation-android
          path: build/apk/*.apk
          if-no-files-found: error

  ios:
    # Flutter plugins (device_info_plus) need the iOS 26 SDK, i.e. Xcode 26.
    runs-on: macos-26
    env:
      HAS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e ./flet_bg_audio -e . "flet[all]==1.0.5"

      - name: Prepare build template
        run: python tools/prepare_template.py

      # Signing is optional: with the IOS_* secrets the job produces an IPA
      # installable on registered devices / TestFlight, without them an
      # unsigned IPA for sideloading (AltStore, Sideloadly).
      - name: Import signing certificate
        if: env.HAS_CERTIFICATE == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profile
        if: env.HAS_CERTIFICATE == 'true'
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$dir"
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          uuid=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -)
          cp "$RUNNER_TEMP/profile.mobileprovision" "$dir/$uuid.mobileprovision"

      - name: Build IPA
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          IOS_SIGNING_CERTIFICATE: ${{ secrets.IOS_SIGNING_CERTIFICATE }}
          IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'ad-hoc' }}
        run: |
          args=(--yes --build-number "$GITHUB_RUN_NUMBER")
          if [ "$HAS_CERTIFICATE" = true ]; then
            args+=(--ios-team-id "$IOS_TEAM_ID"
                   --ios-export-method "$IOS_EXPORT_METHOD"
                   --ios-provisioning-profile "$IOS_PROVISIONING_PROFILE_NAME"
                   --ios-signing-certificate "$IOS_SIGNING_CERTIFICATE")
          fi
          flet build ipa "${args[@]}"

      # Unsigned builds stop at an .xcarchive; pack its .app into an IPA.
      - name: Package unsigned IPA
        if: env.HAS_CERTIFICATE != 'true'
        run: |
          app=$(find build -maxdepth 6 -path '*.xcarchive/Products/Applications/*.app' | head -n 1)
          if [ -z "$app" ]; then
            echo "No .app found in an .xcarchive under build/" >&2
            find build -maxdepth 3
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/build/ipa/rocknation-unsigned.ipa" Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: rocknation-ios
          path: build/ipa/*.ipa
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
