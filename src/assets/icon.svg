<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="disc" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset="0.55" stop-color="#F4511E"/>
      <stop offset="1" stop-color="#B3260B"/>
    </radialGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFD9C2"/>
    </linearGradient>
  </defs>

  <!-- vinyl disc -->
  <circle cx="512" cy="512" r="440" fill="url(#disc)"/>
  <g fill="none" stroke="#000000" stroke-opacity="0.22" stroke-width="6">
    <circle cx="512" cy="512" r="400"/>
    <circle cx="512" cy="512" r="360"/>
    <circle cx="512" cy="512" r="320"/>
    <circle cx="512" cy="512" r="280"/>
  </g>

  <!-- label -->
  <circle cx="512" cy="512" r="230" fill="#16161A"/>
  <circle cx="512" cy="512" r="230" fill="none" stroke="#FF8A3D" stroke-width="10"/>

  <!-- lightning bolt -->
  <path d="M552 330 L430 530 L505 530 L470 694 L598 478 L520 478 Z"
        fill="url(#bolt)" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"/>
</svg>
