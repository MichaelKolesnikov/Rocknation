[project]
name = "flet-bg-audio"
version = "0.1.0"
description = "Background audio playback with a media notification for Flet apps (audio_service + just_audio)."
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "flet>=1.0.5",
]

[tool.setuptools.package-data]
"flutter.flet_bg_audio" = [
    "pubspec.yaml",
    "lib/**",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
